org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is incompatible with KSP's first-build sensitivity in some
# AGP 8.3.x configurations; re-enable once we've validated it across :core:data.
org.gradle.configuration-cache=false
kotlin.code.style=official

# AndroidX baseline (required for any AGP 8.x module).
android.useAndroidX=true
android.nonTransitiveRClass=true
