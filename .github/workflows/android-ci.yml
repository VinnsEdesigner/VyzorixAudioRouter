name: android-ci

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'core/**'
      - 'app/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'core/**'
      - 'app/**'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-common:
    name: core:common — assemble + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble :core:common
        run: ./gradlew :core:common:assembleDebug --no-daemon --stacktrace

      - name: Test :core:common
        run: ./gradlew :core:common:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-common-test-report
          path: core/common/build/reports/tests/testDebugUnitTest

  core-data:
    name: core:data — assemble + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble :core:data
        run: ./gradlew :core:data:assembleDebug --no-daemon --stacktrace

      - name: Test :core:data
        run: ./gradlew :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-data-test-report
          path: core/data/build/reports/tests/testDebugUnitTest

  core-audioengine:
    name: core:audioengine — native build + JVM + host C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # The NDK + CMake versions match `core/audioengine/build.gradle.kts`
          # (`ndkVersion` and the CMake spec). Bumping either requires updating
          # both this manifest and the gradle file.
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Native build (assembleDebug — runs externalNativeBuild)
        run: ./gradlew :core:audioengine:assembleDebug --no-daemon --stacktrace

      - name: JVM tests (loader fallback path)
        run: ./gradlew :core:audioengine:testDebugUnitTest --no-daemon --stacktrace

      - name: Host C++ algorithm tests
        run: ./gradlew :core:audioengine:runNativeHostTests --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-audioengine-test-report
          path: core/audioengine/build/reports/tests/testDebugUnitTest

  core-services:
    name: core:services — assemble + Robolectric tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble :core:services
        run: ./gradlew :core:services:assembleDebug --no-daemon --stacktrace

      - name: Test :core:services
        run: ./gradlew :core:services:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-services-test-report
          path: core/services/build/reports/tests/testDebugUnitTest

  app:
    name: app — assembleDebug + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # NDK + CMake required because :app transitively pulls in :core:audioengine.
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Test :app
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
