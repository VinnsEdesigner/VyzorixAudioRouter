name: Cross-Repo Folder Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**' 

jobs:
  copy-folder:
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout Source Repo
        uses: actions/checkout@v4

  
      - name: Stash folder contents
        run: |
          mkdir -p /tmp/sync-stash
          cp -r docs/. /tmp/sync-stash/

      
      - name: Checkout Destination Repo
        uses: actions/checkout@v4
        with:
          repository: 'VinnsEdesigner/vyzorix-update-server'
          token: ${{ secrets.DESTINATION_REPO_PAT }}
          path: dest-repo-workspace

      
      - name: Move files to specific destination folder
        run: |
          mkdir -p dest-repo-workspace/doc
          cp -r /tmp/sync-stash/. dest-repo-workspace/doc/


      - name: Commit and Push Changes
        run: |
          cd dest-repo-workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/
          
          # Guard against empty commits causing pipeline failures
          if ! git diff-index --quiet HEAD; then
            git commit -m "sync: automated docs update from VyzorixAudioRouter"
            git push origin main
          else
            echo "No file changes detected. Skipping push."
          fi
